<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Manipulasi DOM</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background-color: #f1f5f9;
            color: #1e293b;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            transition: background-color 250ms ease, color 250ms ease;
        }

        main {
            width: min(100%, 560px);
            padding: 40px;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            background-color: #fff;
            box-shadow: 0 20px 50px rgb(15 23 42 / 10%);
            text-align: center;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.7rem, 5vw, 2.25rem);
            letter-spacing: -0.04em;
        }

        p {
            margin: 0 0 28px;
            color: #64748b;
            line-height: 1.6;
        }

        #output3 {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        #output3 button {
            min-height: 44px;
            padding: 11px 16px;
            border: 0;
            border-radius: 10px;
            background-color: #2563eb;
            color: #fff;
            font: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 160ms ease, transform 160ms ease;
        }

        #output3 button:hover {
            transform: translateY(-2px);
            background-color: #1d4ed8;
        }

        #output3 button:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }

        @media (max-width: 480px) {
            main {
                padding: 28px 20px;
            }

            #output3 {
                flex-direction: column;
            }

            #output3 button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Contoh Manipulasi DOM</h1>
        <p>Gunakan tombol berikut untuk mengubah tampilan halaman.</p>
        <div id="output3"></div>
    </main>
    <script src="interactive.js" defer></script>
</body>

</html>
