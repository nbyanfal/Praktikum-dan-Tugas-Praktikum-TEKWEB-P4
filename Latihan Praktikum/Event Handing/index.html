<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Data Diri</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(100%, 440px);
      padding: 32px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 16px 40px rgb(15 23 42 / 8%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    .intro {
      margin: 0 0 24px;
      color: #64748b;
      line-height: 1.5;
    }

    #output4 form {
      display: grid;
      gap: 10px;
    }

    #output4 label {
      margin-top: 8px;
      font-size: 0.95rem;
      font-weight: 600;
    }

    #output4 input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    #output4 input:focus {
      outline: 3px solid rgb(37 99 235 / 18%);
      border-color: #2563eb;
    }

    #output4 button {
      margin-top: 14px;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }

    #output4 button:hover {
      background: #1d4ed8;
    }

    #error-message {
      min-height: 1.5em;
      margin-top: 4px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .card {
        padding: 24px;
      }
    }
  </style>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Form Data Diri</h1>
    <p class="intro">Silakan isi nama dan email Anda untuk melanjutkan.</p>
    <div id="output4"></div>
  </main>
</body>
</html>
