<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f1f5f9;
            color: #172033;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        main {
            width: min(100%, 440px);
            padding: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 20px 50px rgb(15 23 42 / 10%);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.8rem;
        }

        p {
            margin: 0 0 24px;
            color: #64748b;
        }

        .inputs {
            display: grid;
            gap: 14px;
        }

        label {
            display: grid;
            gap: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font: inherit;
        }

        input:focus-visible,
        button:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 2px;
        }

        .operations {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        button {
            min-height: 48px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: #fff;
            font: inherit;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            min-height: 52px;
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            background: #f1f5f9;
            overflow-wrap: anywhere;
        }

        @media (max-width: 420px) {
            main {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Kalkulator Sederhana</h1>
        <p>Masukkan dua angka, lalu pilih operasi.</p>
        <div class="inputs">
            <label for="number-one">Angka pertama
                <input id="number-one" type="number" step="any" placeholder="Contoh: 12" inputmode="decimal">
            </label>
            <label for="number-two">Angka kedua
                <input id="number-two" type="number" step="any" placeholder="Contoh: 3" inputmode="decimal">
            </label>
        </div>
        <div class="operations" aria-label="Operasi kalkulator">
            <button type="button" data-operation="add" aria-label="Tambah">+</button>
            <button type="button" data-operation="subtract" aria-label="Kurang">−</button>
            <button type="button" data-operation="multiply" aria-label="Kali">×</button>
            <button type="button" data-operation="divide" aria-label="Bagi">÷</button>
        </div>
        <p id="result" role="status" aria-live="polite">Hasil akan ditampilkan di sini.</p>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
